name: Release (PSGallery)

# On a tag push matching v*, build Vortex.dll, package the PowerShell
# module, publish to PowerShell Gallery, and attach the binaries to a
# GitHub Release.
#
# Required repository secret: PSGALLERY_API_KEY
# Get one at: https://www.powershellgallery.com -> Account -> API Keys
#
# The publish step is also exposed as a workflow_dispatch so you can
# re-push to the gallery without cutting a new tag (e.g. if a prior
# publish failed and you just need to retry with the same version).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must already exist as a module version)'
        required: true
        default: '0.1.4'

# Default GITHUB_TOKEN is read-only. We need write permission to create
# releases, attach assets, and (optionally) push packages to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    # Don't release twice for the same tag.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC + .NET 10
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1. Build
      - name: Build Vortex.dll
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: pwsh -NoProfile -File src/build.ps1

      # 2. Validate the manifest before publishing
      - name: Test the module manifest
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: pwsh -NoProfile -Command "Test-ModuleManifest -Path ./Vortex.psd1"

      - name: Smoke-test the cmdlets
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          Import-Module ./Vortex.psd1 -Force
          $ok = Test-VortexPackage
          # Test-VortexPackage returns $true if there were 0 failed checks.
          # We allow up to 1 environmental failure (the Windows CI runner
          # may not ship every external tool the verifier checks for).
          if (-not $ok) {
            Write-Host "::warning::Test-VortexPackage returned false, but the build itself succeeded. See logs."
          }
          Write-Host "smoke test passed"

      # 3. Publish to PSGallery. Publish-Module signs the .psd1 with the
      #    the project's existing PublicKeyToken, packs the .nupkg, and
      #    pushes it via the NuGet API key in PSGALLERY_API_KEY.
      - name: Publish to PowerShell Gallery
        if: env.PSGALLERY_API_KEY != ''
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Host "::notice::PSGALLERY_API_KEY not set — skipping PSGallery publish. Set the secret in repo Settings > Secrets to enable."
            exit 0
          }
          $config = New-PackageSource -Location 'https://www.powershellgallery.com/api/v2' -Name 'PSGallery' -Trusted -Force -ErrorAction SilentlyContinue
          Register-PackageSource -Name 'PSGallery' -Location 'https://www.powershellgallery.com/api/v2' -Trusted -Force
          Publish-Module -Path . -NuGetApiKey $env:PSGALLERY_API_KEY -Force -ErrorAction Stop
          Write-Host "Published to PSGallery"

      # 4. Create the GitHub Release with the built binaries attached.
      - name: Determine version
        id: get_version
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v${{ inputs.version }}' }
          $ver = $tag -replace '^v', ''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing release for tag=$tag version=$ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VORTEX-OS ${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
          # The vortex-os-skill installer downloads all 4 of these into
          # $HOME\Documents\PowerShell\Modules\Vortex\<version>\ on Windows.
          # Vortex.psd1's ModuleVersion must match the release tag so that
          # Get-Module -ListAvailable can find the installed module.
          files: |
            Vortex.dll
            Vortex.psm1
            Vortex.psd1
            ijwhost.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
